<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="description" content="Raj AI - Your multilingual AI voice assistant">

<title>Raj AI</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(circle at 50% 15%, rgba(93, 74, 255, 0.18), transparent 28%),
        radial-gradient(circle at 15% 80%, rgba(0, 229, 255, 0.08), transparent 25%),
        #050507;

    color: #ffffff;
    overflow-x: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);

    background-size: 45px 45px;

    mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
    );
}

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
}

.glow.one {
    width: 250px;
    height: 250px;
    background: #573cff;
    top: 5%;
    left: -80px;
}

.glow.two {
    width: 220px;
    height: 220px;
    background: #00d9ff;
    right: -80px;
    bottom: 15%;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: min(1100px, 100%);
    min-height: 100vh;
    margin: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 8px 4px 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 43px;
    height: 43px;

    border-radius: 14px;

    display: grid;
    place-items: center;

    font-size: 20px;
    font-weight: 900;

    background:
        linear-gradient(145deg, #ffffff, #aaa8ff);

    color: #08080b;

    box-shadow:
        0 0 30px rgba(120, 105, 255, 0.25);
}

.brand-text h1 {
    font-size: 20px;
    letter-spacing: -0.5px;
}

.brand-text p {
    margin-top: 2px;
    color: #8f8f9d;
    font-size: 11px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #8f8f9d;
    font-size: 12px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #48ff9b;

    box-shadow: 0 0 12px #48ff9b;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    text-align: center;
    padding: 25px 0 18px;
}

.hero h2 {
    font-size: clamp(28px, 7vw, 52px);
    line-height: 1.05;
    letter-spacing: -1.8px;

    background:
        linear-gradient(
            100deg,
            #ffffff,
            #b9b3ff 45%,
            #7deaff
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.hero p {
    margin-top: 12px;
    color: #858592;
    font-size: 14px;
}

/* =========================================================
   AI ORB
========================================================= */

.orb-container {
    display: flex;
    justify-content: center;
    align-items: center;

    height: 280px;
    position: relative;
}

.orb {
    width: 155px;
    height: 155px;

    border-radius: 50%;

    position: relative;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #a69cff 18%,
            #5b4cff 42%,
            #17132f 75%
        );

    box-shadow:
        0 0 35px rgba(100, 80, 255, 0.7),
        0 0 100px rgba(92, 72, 255, 0.35),
        inset 0 0 35px rgba(255,255,255,0.3);

    animation: orbFloat 4s ease-in-out infinite;
}

.orb::before,
.orb::after {
    content: "";
    position: absolute;
    inset: -22px;

    border: 1px solid rgba(140,130,255,0.18);
    border-radius: 50%;

    animation: ringRotate 8s linear infinite;
}

.orb::after {
    inset: -40px;
    border-color: rgba(0,220,255,0.08);
    animation-duration: 12s;
    animation-direction: reverse;
}

.orb-core {
    position: absolute;
    width: 35%;
    height: 35%;
    border-radius: 50%;

    left: 32%;
    top: 32%;

    background: rgba(255,255,255,0.35);
    filter: blur(14px);
}

/* orb states */

.orb.listening {
    animation:
        orbFloat 2s ease-in-out infinite,
        listeningPulse 1s ease-in-out infinite;
}

.orb.thinking {
    animation:
        orbFloat 2.5s ease-in-out infinite,
        thinkingPulse 1.1s ease-in-out infinite;
}

.orb.speaking {
    animation:
        orbFloat 1.3s ease-in-out infinite,
        speakingPulse 0.55s ease-in-out infinite;
}

/* =========================================================
   VOICE WAVES
========================================================= */

.waves {
    height: 45px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;

    margin-top: -5px;
}

.wave {
    width: 3px;
    height: 8px;

    border-radius: 20px;

    background: #8d82ff;

    opacity: 0.35;

    transition: height 0.15s ease;
}

.waves.active .wave {
    animation: wave 0.8s ease-in-out infinite;
}

.wave:nth-child(1) { animation-delay: 0s; }
.wave:nth-child(2) { animation-delay: .08s; }
.wave:nth-child(3) { animation-delay: .16s; }
.wave:nth-child(4) { animation-delay: .24s; }
.wave:nth-child(5) { animation-delay: .32s; }
.wave:nth-child(6) { animation-delay: .24s; }
.wave:nth-child(7) { animation-delay: .16s; }
.wave:nth-child(8) { animation-delay: .08s; }

/* =========================================================
   STATE
========================================================= */

.state {
    text-align: center;
    height: 25px;

    color: #858592;
    font-size: 12px;
    letter-spacing: 0.3px;
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    width: min(800px, 100%);
    margin: 5px auto 15px;

    display: flex;
    flex-direction: column;
    gap: 10px;

    max-height: 300px;
    overflow-y: auto;

    padding: 4px;

    scrollbar-width: thin;
}

.message {
    max-width: 82%;
    padding: 12px 15px;

    border-radius: 17px;

    font-size: 14px;
    line-height: 1.5;

    animation: messageIn 0.25s ease;
}

.message.user {
    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            #6557ff,
            #493de0
        );

    border-bottom-right-radius: 5px;

    box-shadow:
        0 8px 30px rgba(76, 62, 240, 0.18);
}

.message.ai {
    align-self: flex-start;

    background: rgba(255,255,255,0.055);

    border: 1px solid rgba(255,255,255,0.07);

    border-bottom-left-radius: 5px;

    color: #e9e9f0;
}

.message small {
    display: block;
    margin-bottom: 4px;

    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;

    color: #858592;
}

/* =========================================================
   INPUT AREA
========================================================= */

.input-area {
    width: min(800px, 100%);
    margin: auto auto 0;

    position: sticky;
    bottom: 10px;

    padding: 8px;

    border-radius: 25px;

    background:
        rgba(17,17,22,0.82);

    border:
        1px solid rgba(255,255,255,0.09);

    backdrop-filter: blur(25px);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
}

.input-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.input {
    flex: 1;

    min-width: 0;

    height: 48px;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 14px;

    padding: 0 10px;
}

.input::placeholder {
    color: #686873;
}

.icon-button,
.send-button {
    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    display: grid;
    place-items: center;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.icon-button {
    background: rgba(255,255,255,0.06);
    color: #aaaab5;
    font-size: 18px;
}

.send-button {
    background: #ffffff;
    color: #08080a;

    font-size: 18px;
    font-weight: 900;
}

.icon-button:hover,
.send-button:hover {
    transform: scale(1.06);
}

.icon-button:active,
.send-button:active {
    transform: scale(0.93);
}

.mic.active {
    background: #ff426d;
    color: white;

    box-shadow:
        0 0 25px rgba(255,66,109,0.45);
}

/* =========================================================
   QUICK BUTTONS
========================================================= */

.quick-actions {
    display: flex;
    justify-content: center;
    gap: 7px;

    margin-top: 9px;

    overflow-x: auto;

    scrollbar-width: none;
}

.quick-actions::-webkit-scrollbar {
    display: none;
}

.quick {
    flex: 0 0 auto;

    border: 1px solid rgba(255,255,255,0.07);

    background: rgba(255,255,255,0.035);

    color: #9999a5;

    border-radius: 30px;

    padding: 7px 11px;

    font-size: 11px;

    cursor: pointer;

    transition: 0.2s;
}

.quick:hover {
    background: rgba(255,255,255,0.08);
    color: white;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    text-align: center;

    color: #4f4f59;

    font-size: 10px;

    padding: 14px 0 4px;
}

/* =========================================================
   LOADING DOTS
========================================================= */

.typing {
    display: flex;
    gap: 4px;
    padding: 5px 0;
}

.typing span {
    width: 5px;
    height: 5px;

    background: #8f84ff;

    border-radius: 50%;

    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes orbFloat {
    0%, 100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-10px) scale(1.02);
    }
}

@keyframes listeningPulse {
    50% {
        box-shadow:
            0 0 50px rgba(255,70,120,0.85),
            0 0 120px rgba(255,70,120,0.35);
    }
}

@keyframes thinkingPulse {
    50% {
        transform: scale(1.08);
        filter: hue-rotate(30deg);
    }
}

@keyframes speakingPulse {
    50% {
        transform: scale(1.1);
    }
}

@keyframes ringRotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes wave {
    0%, 100% {
        height: 7px;
        opacity: .35;
    }

    50% {
        height: 32px;
        opacity: 1;
    }
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes typing {
    0%, 100% {
        opacity: .3;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .app {
        padding:
            12px
            12px
            calc(12px + env(safe-area-inset-bottom));
    }

    .header {
        padding-bottom: 12px;
    }

    .logo {
        width: 39px;
        height: 39px;
        border-radius: 12px;
    }

    .brand-text h1 {
        font-size: 18px;
    }

    .hero {
        padding-top: 15px;
    }

    .hero h2 {
        font-size: 31px;
    }

    .hero p {
        font-size: 12px;
    }

    .orb-container {
        height: 235px;
    }

    .orb {
        width: 125px;
        height: 125px;
    }

    .chat {
        max-height: 245px;
    }

    .message {
        max-width: 90%;
        font-size: 13px;
    }

    .input-area {
        bottom: 5px;
    }

    .input {
        font-size: 13px;
    }

    .status {
        font-size: 10px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">

            <div class="logo">
                R
            </div>

            <div class="brand-text">
                <h1>Raj AI</h1>
                <p>Intelligent Voice Assistant</p>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="connectionStatus">Online</span>
        </div>

    </header>


    <main class="main">

        <!-- HERO -->
        <section class="hero">

            <h2>How can I help?</h2>

            <p>
                Talk naturally with Raj AI
            </p>

        </section>


        <!-- AI ORB -->
        <section class="orb-container">

            <div
                class="orb"
                id="orb"
                aria-label="Raj AI"
            >

                <div class="orb-core"></div>

            </div>

        </section>


        <!-- VOICE WAVES -->
        <div class="waves" id="waves">

            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>

        </div>


        <!-- STATE -->
        <div
            class="state"
            id="state"
        >
            Ready
        </div>


        <!-- CHAT -->
        <section
            class="chat"
            id="chat"
            aria-live="polite"
        >

        </section>


        <!-- INPUT -->
        <section class="input-area">

            <div class="input-row">

                <button
                    class="icon-button mic"
                    id="micButton"
                    title="Voice input"
                    aria-label="Voice input"
                >
                    🎙
                </button>

                <input
                    id="messageInput"
                    class="input"
                    type="text"
                    autocomplete="off"
                    placeholder="Ask Raj AI anything..."
                    enterkeyhint="send"
                >

                <button
                    class="send-button"
                    id="sendButton"
                    title="Send"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>


            <!-- QUICK ACTIONS -->
            <div class="quick-actions">

                <button
                    class="quick"
                    data-message="Tell me an interesting fact."
                >
                    💡 Interesting fact
                </button>

                <button
                    class="quick"
                    data-message="Explain something interesting to me."
                >
                    🧠 Explain
                </button>

                <button
                    class="quick"
                    data-message="Tell me a short joke."
                >
                    😂 Joke
                </button>

            </div>

        </section>

    </main>


    <footer class="footer">
        Raj AI • Created by Raj
    </footer>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://talking-ai-qz3v.onrender.com/chat";


/* =========================================================
   ELEMENTS
========================================================= */

const orb =
    document.getElementById("orb");

const waves =
    document.getElementById("waves");

const state =
    document.getElementById("state");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const connectionStatus =
    document.getElementById("connectionStatus");


/* =========================================================
   STATE
========================================================= */

let isListening = false;
let isSpeaking = false;

let recognition = null;


/* =========================================================
   UI STATE
========================================================= */

function setState(newState) {

    orb.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );

    waves.classList.remove("active");

    switch (newState) {

        case "listening":

            state.textContent =
                "Listening...";

            orb.classList.add("listening");

            waves.classList.add("active");

            break;


        case "thinking":

            state.textContent =
                "Thinking...";

            orb.classList.add("thinking");

            break;


        case "speaking":

            state.textContent =
                "Speaking...";

            orb.classList.add("speaking");

            waves.classList.add("active");

            break;


        default:

            state.textContent =
                "Ready";
    }
}


/* =========================================================
   CHAT MESSAGE
========================================================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    const label =
        document.createElement("small");

    label.textContent =
        type === "user"
            ? "You"
            : "Raj AI";

    const content =
        document.createElement("div");

    content.textContent = text;

    message.appendChild(label);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function addTyping() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";

    const label =
        document.createElement("small");

    label.textContent =
        "Raj AI";

    const typing =
        document.createElement("div");

    typing.className =
        "typing";

    typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;

    message.appendChild(label);
    message.appendChild(typing);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {
        typing.remove();
    }
}


/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text) {

    if (/[\u0980-\u09FF]/.test(text)) {
        return "bn-IN";
    }

    if (/[\u0900-\u097F]/.test(text)) {
        return "hi-IN";
    }

    return "en-IN";
}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        setState("ready");
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang =
        detectLanguage(text);

    utterance.rate =
        0.95;

    utterance.pitch =
        1.0;

    utterance.volume =
        1.0;

    utterance.onstart = () => {

        isSpeaking = true;

        setState("speaking");
    };

    utterance.onend = () => {

        isSpeaking = false;

        setState("ready");
    };

    utterance.onerror = () => {

        isSpeaking = false;

        setState("ready");
    };

    speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(
    customText = null
) {

    const text =
        customText !== null
            ? customText.trim()
            : input.value.trim();

    if (!text) {
        return;
    }

    if (isListening) {
        stopListening();
    }

    if (customText === null) {
        input.value = "";
    }

    addMessage(
        text,
        "user"
    );

    addTyping();

    setState("thinking");

    sendButton.disabled = true;

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


        const data =
            await response.json();


        removeTyping();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );
        }


        const reply =
            data.reply ||
            "Sorry, I couldn't generate a response.";


        addMessage(
            reply,
            "ai"
        );


        speak(reply);


        connectionStatus.textContent =
            "Online";

    }

    catch (error) {

        console.error(
            "Raj AI error:",
            error
        );

        removeTyping();

        addMessage(
            "Sorry, I couldn't connect to Raj AI right now. Please try again.",
            "ai"
        );

        setState("ready");

        connectionStatus.textContent =
            "Connection issue";
    }

    finally {

        sendButton.disabled =
            false;
    }
}


/* =========================================================
   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    () => {
        sendMessage();
    }
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   QUICK ACTIONS
========================================================= */

document
    .querySelectorAll(".quick")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const message =
                    button.dataset.message;

                sendMessage(message);
            }
        );

    });


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        true;

    recognition.lang =
        "en-IN";


    recognition.onstart = () => {

        isListening = true;

        micButton.classList.add(
            "active"
        );

        setState("listening");
    };


    recognition.onresult =
        event => {

            let transcript = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0].transcript;
            }

            input.value =
                transcript;
        };


    recognition.onerror =
        event => {

            console.log(
                "Speech recognition:",
                event.error
            );

            stopListening();
        };


    recognition.onend =
        () => {

            if (isListening) {

                isListening =
                    false;

                micButton.classList.remove(
                    "active"
                );

                setState("ready");

                const text =
                    input.value.trim();

                if (text) {
                    sendMessage();
                }
            }
        };

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    if (!recognition) {

        alert(
            "Voice recognition is not supported by this browser. Try Chrome."
        );

        return;
    }

    if (isSpeaking) {

        speechSynthesis.cancel();

        isSpeaking = false;
    }

    try {

        recognition.lang =
            "en-IN";

        recognition.start();

    }

    catch (error) {

        console.log(error);
    }
}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening() {

    isListening =
        false;

    micButton.classList.remove(
        "active"
    );

    if (recognition) {

        try {
            recognition.stop();
        }

        catch (error) {
            console.log(error);
        }
    }

    setState("ready");
}


/* =========================================================
   MIC BUTTON
========================================================= */

micButton.addEventListener(
    "click",
    () => {

        if (isListening) {
            stopListening();
        }
        else {
            startListening();
        }

    }
);


/* =========================================================
   INITIAL CONNECTION CHECK
========================================================= */

async function checkServer() {

    try {

        const response =
            await fetch(
                API_URL.replace(
                    "/chat",
                    "/health"
                ),
                {
                    method: "GET"
                }
            );

        if (response.ok) {

            connectionStatus.textContent =
                "Online";
        }

        else {

            connectionStatus.textContent =
                "Server issue";
        }

    }

    catch (error) {

        console.log(
            "Health check failed:",
            error
        );

        connectionStatus.textContent =
            "Offline";
    }
}


/* =========================================================
   INITIAL MESSAGE
========================================================= */

addMessage(
    "Hi! I'm Raj AI. Ask me anything or tap the microphone to talk.",
    "ai"
);


/* =========================================================
   START
========================================================= */

checkServer();

setState("ready");

</script>
