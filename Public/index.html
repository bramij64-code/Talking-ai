<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raj AI — Voice Test</title>

<style>
:root {
    --bg: #070910;
    --card: rgba(255,255,255,.07);
    --line: rgba(255,255,255,.13);
    --text: #f7f8ff;
    --muted: #aeb4c7;
    --accent: #7c5cff;
    --accent2: #00d9ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 25%, #17204a 0, #0b1020 35%, var(--bg) 72%);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

.app {
    width: min(760px, 100%);
    min-height: 100vh;
    padding: 22px 16px 30px;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-weight: 900;
    letter-spacing: 1.5px;
    font-size: 20px;
}

.status {
    font-size: 12px;
    color: #78ffb0;
    display: flex;
    align-items: center;
    gap: 7px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #42ff9b;
    box-shadow: 0 0 14px #42ff9b;
}

/* HERO */

.hero {
    text-align: center;
    margin: auto 0 22px;
}

.avatar-wrap {
    position: relative;
    width: min(330px, 72vw);
    aspect-ratio: 1;
    margin: 0 auto 10px;
    display: grid;
    place-items: center;
}

.avatar-wrap::before,
.avatar-wrap::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(124,92,255,.35);
    animation: pulse 2.8s ease-in-out infinite;
}

.avatar-wrap::before {
    inset: 4%;
    box-shadow: 0 0 70px rgba(124,92,255,.25);
}

.avatar-wrap::after {
    inset: 0;
    border-color: rgba(0,217,255,.18);
    animation-delay: .8s;
}

@keyframes pulse {
    50% {
        transform: scale(1.06);
        opacity: .45;
    }
}

.avatar {
    width: 78%;
    height: 78%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 20px 35px rgba(0,0,0,.5));
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    50% {
        transform: translateY(-9px);
    }
}

h1 {
    margin: 0;
    font-size: 32px;
}

.tag {
    color: var(--muted);
    margin: 8px 0 12px;
}

.state {
    font-weight: 700;
    min-height: 24px;
}

/* VOICE WAVE */

.wave {
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin: 12px 0;
}

.bar {
    width: 4px;
    height: 8px;
    border-radius: 10px;
    background: linear-gradient(#7c5cff, #00d9ff);
    transition: .15s;
}

.speaking .bar {
    animation: wave .55s ease-in-out infinite alternate;
}

.speaking .bar:nth-child(2) {
    animation-delay: .08s;
}

.speaking .bar:nth-child(3) {
    animation-delay: .16s;
}

.speaking .bar:nth-child(4) {
    animation-delay: .24s;
}

.speaking .bar:nth-child(5) {
    animation-delay: .32s;
}

@keyframes wave {
    to {
        height: 28px;
    }
}

/* CHAT */

.panel {
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px);
    border-radius: 24px;
    padding: 14px;
    box-shadow: 0 20px 70px rgba(0,0,0,.25);
}

.messages {
    height: 190px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 4px 2px 10px;
}

.msg {
    max-width: 86%;
    padding: 10px 13px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 14px;
}

.user {
    align-self: flex-end;
    background: linear-gradient(135deg,#684cff,#8c72ff);
}

.ai {
    align-self: flex-start;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.08);
}

/* INPUT */

.controls {
    display: flex;
    gap: 9px;
    margin-top: 10px;
}

.input {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,.25);
    border: 1px solid var(--line);
    color: white;
    border-radius: 15px;
    padding: 13px;
    outline: none;
}

.input:focus {
    border-color: var(--accent);
}

.btn {
    border: 0;
    border-radius: 15px;
    color: white;
    background: rgba(255,255,255,.1);
    padding: 0 15px;
    font-size: 18px;
}

.btn:active {
    transform: scale(.95);
}

/* MICROPHONE */

.mic {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    margin: 14px auto 0;
    border: 1px solid rgba(255,255,255,.2);
    background: linear-gradient(135deg,#694cff,#00bfe9);
    box-shadow: 0 0 35px rgba(95,83,255,.35);
    font-size: 25px;
    color: white;
    cursor: pointer;
}

.mic.listening {
    animation: mic 1s infinite;
}

.mic:active {
    transform: scale(.95);
}

@keyframes mic {
    50% {
        box-shadow:
            0 0 0 14px rgba(124,92,255,.08),
            0 0 45px rgba(0,217,255,.6);
    }
}

small {
    display: block;
    text-align: center;
    color: #777f96;
    margin-top: 10px;
}

/* MOBILE */

@media(max-width:500px) {

    h1 {
        font-size: 27px;
    }

    .avatar-wrap {
        width: 290px;
    }

    .messages {
        height: 155px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <div class="logo">RAJ AI</div>

        <div class="status">
            <span class="dot"></span>
            <span id="connection">Backend ready</span>
        </div>
    </header>


    <!-- MAIN -->
    <main class="hero">

        <div class="avatar-wrap">

            <!-- Put your cartoon image here -->
            <img
                class="avatar"
                id="avatar"
                src="avatar.png"
                alt="Raj AI cartoon"
            >

        </div>

        <h1>Hi, I'm Raj AI 👋</h1>

        <div class="tag">
            Talk to me. I'm listening.
        </div>

        <div class="state" id="state">
            Ready
        </div>


        <!-- Voice Visualizer -->
        <div class="wave">

            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>

        </div>


        <!-- Microphone -->
        <button
            class="mic"
            id="mic"
            aria-label="Start voice input"
        >
            🎙️
        </button>

    </main>


    <!-- CHAT -->
    <section class="panel">

        <div
            class="messages"
            id="messages"
        >

            <div class="msg ai">
                Hello! I'm Raj AI. Tap the microphone or type a message. 😊
            </div>

        </div>


        <div class="controls">

            <input
                class="input"
                id="input"
                placeholder="Type something..."
                autocomplete="off"
            >

            <button
                class="btn"
                id="send"
            >
                ➤
            </button>

        </div>

        <small>
            Connected to your Render backend • Voice uses your browser's speech engine
        </small>

    </section>

</div>


<script>

/* =====================================================
   RENDER BACKEND
===================================================== */

const API =
    "https://talking-ai-qz3v.onrender.com/chat";


/* =====================================================
   ELEMENTS
===================================================== */

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const state =
    document.getElementById("state");

const connection =
    document.getElementById("connection");


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text, type) {

    const element =
        document.createElement("div");

    element.className =
        "msg " + type;

    element.textContent =
        text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =====================================================
   STATE
===================================================== */

function setState(text) {

    state.textContent = text;
}


/* =====================================================
   SPEAKING ANIMATION
===================================================== */

function setSpeaking(enabled) {

    document.body.classList.toggle(
        "speaking",
        enabled
    );
}


/* =====================================================
   LANGUAGE DETECTION
===================================================== */

function detectLanguage(text) {

    // Bengali Unicode
    if (/[\u0980-\u09FF]/.test(text)) {

        return "bn-IN";
    }

    // Hindi / Devanagari
    if (/[\u0900-\u097F]/.test(text)) {

        return "hi-IN";
    }

    // English fallback
    return "en-US";
}


/* =====================================================
   FIND VOICE
===================================================== */

function chooseVoice(language) {

    const voices =
        speechSynthesis.getVoices();

    const prefix =
        language
            .toLowerCase()
            .split("-")[0];


    // First try exact language

    let voice =
        voices.find(
            v => v.lang
                .toLowerCase()
                .startsWith(prefix)
        );


    // English fallback

    if (!voice) {

        voice =
            voices.find(
                v => v.lang
                    .toLowerCase()
                    .startsWith("en")
            );
    }


    return voice || voices[0];
}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        console.log(
            "Speech synthesis is not supported."
        );

        return;
    }


    speechSynthesis.cancel();


    const language =
        detectLanguage(text);


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        language;

    speech.rate =
        1;

    speech.pitch =
        1;

    speech.volume =
        1;


    const voice =
        chooseVoice(language);


    if (voice) {

        speech.voice =
            voice;
    }


    speech.onstart = () => {

        setState(
            "Speaking..."
        );

        setSpeaking(true);
    };


    speech.onend = () => {

        setState(
            "Ready"
        );

        setSpeaking(false);
    };


    speech.onerror = () => {

        setState(
            "Ready"
        );

        setSpeaking(false);
    };


    speechSynthesis.speak(
        speech
    );
}


/* =====================================================
   SEND MESSAGE TO RENDER
===================================================== */

async function sendMessage(text) {

    text =
        text.trim();


    if (!text) {

        return;
    }


    // Show user message

    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    setState(
        "Thinking..."
    );


    try {

        const response =
            await fetch(
                API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.reply) {

            throw new Error(
                "No AI reply received"
            );
        }


        // Show AI reply

        addMessage(
            data.reply,
            "ai"
        );


        // Speak AI reply

        speak(
            data.reply
        );


        connection.textContent =
            "Backend connected";

    }

    catch (error) {

        console.error(
            error
        );


        connection.textContent =
            "Connection error";


        setState(
            "Error"
        );


        addMessage(
            "I couldn't connect to the AI backend. Please try again.",
            "ai"
        );
    }
}


/* =====================================================
   SEND BUTTON
===================================================== */

send.onclick = () => {

    sendMessage(
        input.value
    );
};


/* =====================================================
   ENTER KEY
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage(
                input.value
            );
        }

    }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

let recognition = null;

let listening = false;


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.lang =
        "en-IN";


    /* START LISTENING */

    recognition.onstart =
        () => {

            listening =
                true;


            mic.classList.add(
                "listening"
            );


            mic.textContent =
                "⏹️";


            setState(
                "Listening..."
            );
        };


    /* GET SPEECH */

    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript;


            sendMessage(
                text
            );
        };


    /* ERROR */

    recognition.onerror =
        event => {

            console.log(
                "Speech error:",
                event.error
            );


            listening =
                false;


            mic.classList.remove(
                "listening"
            );


            mic.textContent =
                "🎙️";


            setState(
                "Ready"
            );
        };


    /* STOP */

    recognition.onend =
        () => {

            listening =
                false;


            mic.classList.remove(
                "listening"
            );


            mic.textContent =
                "🎙️";


            if (
                state.textContent ===
                "Listening..."
            ) {

                setState(
                    "Ready"
                );
            }
        };


    /* MICROPHONE BUTTON */

    mic.onclick =
        () => {

            if (listening) {

                recognition.stop();

            } else {

                speechSynthesis.cancel();

                recognition.start();
            }
        };

} else {

    mic.onclick =
        () => {

            alert(
                "Voice input is not supported by this browser. You can still type your message."
            );

        };
}


/* =====================================================
   LOAD AVAILABLE VOICES
===================================================== */

if ("speechSynthesis" in window) {

    speechSynthesis.getVoices();


    speechSynthesis.onvoiceschanged =
        () => {

            speechSynthesis.getVoices();

        };
}

</script>

</body>
</html>
